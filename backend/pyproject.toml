[project]
name = "money-tracking-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.12.13",
    "alembic==1.16.2",
    "curl-cffi==0.17.0",
    "fastapi[standard]==0.115.14",
    "gql==3.5.3",
    "ibind==0.1.15",
    "openai==2.43.0",
    "paho-mqtt==2.1.0",
    "pebble==5.1.1",
    "plaid-python==34.0.0",
    "prometheus-client==0.22.1",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "pypdf==6.13.3",
    "python-multipart==0.0.20",
    "sqlmodel==0.0.24",
]

[dependency-groups]
dev = [
    "debugpy==1.8.14",
    "mypy==2.4.1",
    "pytest==8.4.2",
    "pytest-mock==3.14.1",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["migrations", "tests", "data_export/adapter/openapi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

# These third-party packages do not publish type information.
[[tool.mypy.overrides]]
module = ["plaid", "plaid.*", "testcontainers.postgres"]
ignore_missing_imports = true
