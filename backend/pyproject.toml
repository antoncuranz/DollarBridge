[project]
name = "money-tracking-backend"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "aiohttp==3.14.5",
    "alembic==1.20.1",
    "curl-cffi==0.17.0",
    "fastapi[standard]==0.162.0",
    "gql==4.4.0",
    "ibind==0.2.2",
    "openai==3.42.0",
    "paho-mqtt==2.1.0",
    "pebble==5.2.3",
    "plaid-python==46.0.0",
    "prometheus-client==0.26.0",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pypdf==6.21.4",
    "python-multipart==0.0.33",
    "sqlmodel==0.0.48",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-mock==3.17.0",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["migrations", "tests", "data_export/adapter/openapi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

# These third-party packages do not publish type information.
[[tool.mypy.overrides]]
module = ["plaid", "plaid.*", "testcontainers.postgres"]
ignore_missing_imports = true
