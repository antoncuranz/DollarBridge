name: Build and Push Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-*.yml'
      - 'ci/frontend-checks.sh'
      - 'ci/lib.sh'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-*.yml'
      - 'ci/frontend-checks.sh'
      - 'ci/lib.sh'
      - '.github/workflows/docker-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On pull requests, frontend-checks.yml already runs on its own (it is a required
  # status check), so only gate the image on it for pushes to main.
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/frontend-checks.yml

  build:
    needs: checks
    if: ${{ !cancelled() && needs.checks.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      context: frontend
      image: frontend
