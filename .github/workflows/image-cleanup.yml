name: Image cleanup

# Deletes old images from GHCR so pull request builds don't pile up.
#   - untagged images are deleted
#   - tagged images (pr-*, sha-*) are deleted, except the 10 newest
#   - nothing younger than 4 weeks and nothing tagged latest is deleted
# Run manually with dry-run first to see what would be deleted.

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be deleted
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Clean up GHCR images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: money-tracking/backend,money-tracking/frontend,money-tracking/scripts
          delete-untagged: true
          exclude-tags: latest
          older-than: 4 weeks
          keep-n-tagged: 10
          dry-run: ${{ inputs.dry-run == true }}
